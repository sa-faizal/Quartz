name: Import downstream CI health

on:
  workflow_dispatch:
    inputs:
      report_json:
        description: "Schema 1.0 downstream observation (maintainer-authorized)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ci-health-data
  cancel-in-progress: false

jobs:
  import:
    if: github.repository == 'sa-faizal/Quartz' || vars.CI_HEALTH_ENABLED == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ci-health-data
          path: health-state
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Restore compressed evidence history
        run: python scripts/ci_health/state_archive.py restore --directory health-state
      - name: Validate and import report
        env:
          REPORT_JSON: ${{ inputs.report_json }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          Path('health-state/incoming.json').write_text(os.environ['REPORT_JSON'], encoding='utf-8')
          PY
          python scripts/ci_health/cli.py --db health-state/health.sqlite ingest-downstream \
            --report health-state/incoming.json --output health-state/health.json
      - name: Archive evidence history
        run: python scripts/ci_health/state_archive.py archive --directory health-state
      - name: Publish updated Quartz feed
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: health-state
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add health.sqlite.gz health.json
          if git ls-files --error-unmatch health.sqlite >/dev/null 2>&1; then
            git rm --cached health.sqlite
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'Import downstream CI health observation'
            gh auth setup-git
            git push origin HEAD:ci-health-data
          fi
